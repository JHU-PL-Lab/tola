          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_lib"
          LIB_NATIVE=$(ls /usr/lib/x86_64-linux-gnu/libssl.so.* /usr/lib*/libssl.so.* 2>/dev/null \
                  "$(brew --prefix openssl@3 2>/dev/null)/lib/libssl.dylib" 2>/dev/null \
                  | head -1)
          test -n "$LIB_NATIVE" -a -e "$LIB_NATIVE"
          nm -D "$LIB_NATIVE" 2>/dev/null \
            | python3 canary/scripts/summarize_native.py --path "$LIB_NATIVE" --prefixes 'SSL_,TLS_,BIO_' --watchlist 'SSL_CTX_new,SSL_new,SSL_connect,SSL_read,SSL_write,TLS_method' \
            > $GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_lib/summary.json

      - name: probe_binding
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_binding"
          eval $(opam env)
          ocamlfind ocamlopt -package ssl -linkpkg canary/examples/ssl/ssl_example.ml -o $GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_binding/ssl_example > $GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_binding/probe.log 2>&1 && $GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_binding/ssl_example >> $GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_binding/probe.log 2>&1
          RC=$?
          cat $GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_binding/probe.log
          exit $RC

      - name: probe_binding_summary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_binding"
          eval $(opam env)
          PKG_DIR=$(ocamlfind query 'ssl' 2>/dev/null)
          test -n "$PKG_DIR"
          { for f in "$PKG_DIR"/*.cmxa "$PKG_DIR"/*.cma; do
              [ -f "$f" ] && ocamlobjinfo "$f"
            done
          } | python3 canary/scripts/summarize_ocaml.py --path 'ssl' --watchlist 'Ssl,Ssl_threads' \
            > $GITHUB_WORKSPACE/_out/canary/projects/ssl/probe_binding/summary.json

