name: Canary CI

on:
  push:
  pull_request:

jobs:
  llvm-19:
    name: LLVM 19 — fetch + probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - name: Add canary opam repo
        run: |
          eval $(opam env)
          opam repo add canary-local \
            "file://$GITHUB_WORKSPACE/canary/templates/opam-local-repo" \
            --rank=1 2>/dev/null \
            || opam repo set-url canary-local \
            "file://$GITHUB_WORKSPACE/canary/templates/opam-local-repo"
          opam update canary-local

      - name: fetch_lib
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/fetch_lib"
          sudo apt-get install -y llvm-19-dev && echo 'installed' > $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/fetch_lib/lib.ok

      - name: fetch_binding
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/fetch_binding"
          eval $(opam env) && opam install llvm.19-shared -y --assume-depexts && eval $(opam env) && opam install -y ocamlfind && echo 'installed' > $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/fetch_binding/binding.ok

      - name: probe_lib
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_lib"
          LLVM_CONFIG=$(if command -v llvm-config-19 >/dev/null 2>&1; then command -v llvm-config-19; elif command -v llvm-config >/dev/null 2>&1; then command -v llvm-config; elif command -v brew >/dev/null 2>&1; then printf '%s\n' "$(brew --prefix llvm@19)/bin/llvm-config-19"; else printf '%s\n' llvm-config-19; fi)
          test -x "$LLVM_CONFIG"
          "$LLVM_CONFIG" --version > $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_lib/probe.log 2>&1

      - name: probe_lib_summary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_lib"
          LLVM_CONFIG=$(if command -v llvm-config-19 >/dev/null 2>&1; then command -v llvm-config-19; elif command -v llvm-config >/dev/null 2>&1; then command -v llvm-config; elif command -v brew >/dev/null 2>&1; then printf '%s\n' "$(brew --prefix llvm@19)/bin/llvm-config-19"; else printf '%s\n' llvm-config-19; fi)
          LLVM_LIB=$(ls "$("$LLVM_CONFIG" --libdir)"/libLLVM*.so 2>/dev/null | head -1)
          test -n "$LLVM_LIB"
          nm -D "$LLVM_LIB" 2>/dev/null \
            | python3 canary/scripts/summarize_native.py --path "$LLVM_LIB" --prefixes 'LLVM' --watchlist 'LLVMContextCreate,LLVMModuleCreateWithName,LLVMCreateBuilder' \
            > $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_lib/summary.json

      - name: probe_binding_pkg
        id: probe_binding_pkg
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg"
          eval $(opam env)
          ocamlfind ocamlopt -package llvm -linkpkg $GITHUB_WORKSPACE/canary/examples/llvm/llvm_example_dev.ml \
            -o $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg/llvm_example > $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg/probe.log 2>&1 || exit 1
          $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg/llvm_example >> $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg/probe.log 2>&1

      - name: probe_binding_pkg (verify)
        run: |
          if [ "${{ steps.probe_binding_pkg.outcome }}" = "success" ]; then
            echo "FAIL: expected failure but step succeeded"
            exit 1
          fi
          if grep -qF 'Unbound constructor Opcode.UncondBr' "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg/probe.log" 2>/dev/null \
                    || grep -qF 'Unbound constructor "Opcode.UncondBr"' "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg/probe.log" 2>/dev/null; then
            echo "PASS: expected failure confirmed"
          else
            echo "FAIL: expected message not found in probe.log"
            cat "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg/probe.log" || true
            exit 1
          fi

      - name: probe_binding_pkg_summary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg"
          eval $(opam env)
          PKG_DIR=$(ocamlfind query 'llvm' 2>/dev/null)
          test -n "$PKG_DIR"
          { for f in "$PKG_DIR"/*.cmxa "$PKG_DIR"/*.cma; do
              [ -f "$f" ] && ocamlobjinfo "$f"
            done
          } | python3 canary/scripts/summarize_ocaml.py --path 'llvm' --watchlist 'Llvm,Llvm_target,Llvm_executionengine' \
            > $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pkg/summary.json

      - name: probe_binding_pip
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pip"
          set -e
          INSTALL_LOG=$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pip/install.log
          if command -v pip >/dev/null 2>&1; then
            pip install --quiet llvmlite > "$INSTALL_LOG" 2>&1
          elif python3 -m pip --version >/dev/null 2>&1; then
            python3 -m pip install --quiet llvmlite > "$INSTALL_LOG" 2>&1
          elif command -v uv >/dev/null 2>&1; then
            uv pip install --quiet llvmlite > "$INSTALL_LOG" 2>&1
          else
            echo "no pip / python3 -m pip / uv available" > "$INSTALL_LOG"
            exit 1
          fi
          python3 -c "import llvmlite.binding as llvm; print('llvmlite ok:', llvm.llvm_version_info)" > $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pip/probe.log 2>&1 || { cat $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pip/probe.log; exit 1; }
          cat $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pip/probe.log

      - name: probe_binding_pip_summary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pip"
          python3 canary/scripts/summarize_python.py --pkg 'llvmlite.binding' --watchlist 'initialize,initialize_native_target,parse_assembly,create_mcjit_compiler,Target' > $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_binding_pip/summary.json

      - name: probe_app
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_app"
          python3 -m pip install --quiet llvmlite
          python3 -c "import llvmlite.binding as llvm; print(llvm.llvm_version_info)" > $GITHUB_WORKSPACE/_out/canary/projects/llvm/19/probe_app/probe.log 2>&1


  z3-dev:
    name: Z3 dev — build from source + probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - name: Restore sccache disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/sccache
          key: sccache-z3-${{ runner.os }}-${{ hashFiles('canary/templates/opam-local-repo/packages/z3/z3.dev/opam.in') }}
          restore-keys: |
            sccache-z3-${{ runner.os }}-
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install system build dependencies
        run: sudo apt-get install -y --no-install-recommends cmake ninja-build libgmp-dev python3-dev mold
      - name: Add canary opam repo
        run: |
          eval $(opam env)
          opam repo add canary-local \
            "file://$GITHUB_WORKSPACE/canary/templates/opam-local-repo" \
            --rank=1 2>/dev/null \
            || opam repo set-url canary-local \
            "file://$GITHUB_WORKSPACE/canary/templates/opam-local-repo"
          opam update canary-local

      - name: fetch_lib
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/fetch_lib"
          sudo apt-get install -y z3 && echo 'installed' > $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/fetch_lib/lib.ok

      - name: pack_binding
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/pack_binding"
          eval $(opam env)
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/pack_binding/pack-repo/packages/z3/z3.dev"
          cp "$GITHUB_WORKSPACE/canary/templates/opam-local-repo/packages/z3/z3.dev/opam.in" "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/pack_binding/pack-repo/packages/z3/z3.dev/opam.in"
          (cd "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/pack_binding/pack-repo" && OPAMVAR_CANARY_Z3_SRC="git+https://github.com/arbipher/z3.git" opam config subst "packages/z3/z3.dev/opam")
          opam repo add canary-local-pack "file://$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/pack_binding/pack-repo" --rank=1 \
            || opam repo set-url canary-local-pack "file://$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/pack_binding/pack-repo"
          opam update canary-local-pack
          opam remove -y z3.dev || true
          opam install -y z3.dev --verbose --keep-build-dir --assume-depexts \
            && echo 'ok' > $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/pack_binding/pack.ok

      - name: probe_lib
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_lib"
          LIB_Z3=$(pkg-config --variable=libdir z3 2>/dev/null)/libz3.so
          test -f "$LIB_Z3" || LIB_Z3=$(pkg-config --variable=libdir z3 2>/dev/null)/libz3.dylib
          test -f "$LIB_Z3"
          COUNT=$(nm -D "$LIB_Z3" 2>/dev/null | grep -v ' U ' | grep -c 'Z3_' || echo 0)
          printf 'Z3_ symbols exported: %s\n' "$COUNT" | tee $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_lib/probe.log
          test "$COUNT" -gt 0

      - name: probe_lib_summary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_lib"
          LIB_Z3=$(pkg-config --variable=libdir z3 2>/dev/null)/libz3.so
          test -f "$LIB_Z3" || LIB_Z3=$(pkg-config --variable=libdir z3 2>/dev/null)/libz3.dylib
          test -f "$LIB_Z3"
          nm -D "$LIB_Z3" 2>/dev/null \
            | python3 canary/scripts/summarize_native.py --path "$LIB_Z3" --prefixes 'Z3_,Z3_mk_,Z3_solver_' --watchlist 'Z3_mk_solver,Z3_mk_optimize,Z3_mk_context,Z3_solver_check,Z3_mk_optimize_assert_soft' \
            > $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_lib/summary.json

      - name: probe_binding_pkg
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pkg"
          eval $(opam env)
          ocamlfind ocamlopt -package z3 -linkpkg $GITHUB_WORKSPACE/canary/examples/z3/z3_example.ml \
            -o $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pkg/z3_example > $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pkg/probe.log 2>&1 || exit 1
          $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pkg/z3_example >> $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pkg/probe.log 2>&1

      - name: probe_binding_pkg_summary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pkg"
          eval $(opam env)
          PKG_DIR=$(ocamlfind query 'z3' 2>/dev/null)
          test -n "$PKG_DIR"
          { for f in "$PKG_DIR"/*.cmxa "$PKG_DIR"/*.cma; do
              [ -f "$f" ] && ocamlobjinfo "$f"
            done
          } | python3 canary/scripts/summarize_ocaml.py --path 'z3' --watchlist 'Z3' \
            > $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pkg/summary.json

      - name: probe_binding_pip
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pip"
          set -e
          INSTALL_LOG=$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pip/install.log
          if command -v pip >/dev/null 2>&1; then
            pip install --quiet z3-solver > "$INSTALL_LOG" 2>&1
          elif python3 -m pip --version >/dev/null 2>&1; then
            python3 -m pip install --quiet z3-solver > "$INSTALL_LOG" 2>&1
          elif command -v uv >/dev/null 2>&1; then
            uv pip install --quiet z3-solver > "$INSTALL_LOG" 2>&1
          else
            echo "no pip / python3 -m pip / uv available" > "$INSTALL_LOG"
            exit 1
          fi
          python3 -c "import z3; s = z3.Solver(); x = z3.Int('x'); s.add(x > 0); print('z3 ok:', s.check())" > $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pip/probe.log 2>&1 || { cat $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pip/probe.log; exit 1; }
          cat $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pip/probe.log

      - name: probe_binding_pip_summary
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pip"
          python3 canary/scripts/summarize_python.py --pkg 'z3' --watchlist 'Solver,BitVec,Optimize,Tactic,Context,Int,Real,Bool' > $GITHUB_WORKSPACE/_out/canary/projects/z3/dev/probe_binding_pip/summary.json


