:root{color:var(--fg);font:15px/1.6 ui-serif,Georgia,serif}
.flow{width:100%;max-width:1000px;height:auto;margin:1rem 0;background:var(--card);
border:1px solid var(--line);border-radius:10px}
.flow text{font:13px ui-sans-serif,system-ui,sans-serif;fill:var(--fg)}
.flow .fsub{font:11.5px ui-monospace,monospace;fill:var(--mut)}
.flow .flane{font:600 11px ui-monospace,monospace;fill:var(--mut);letter-spacing:.05em}
.flow .fnote{font:italic 11px ui-sans-serif,system-ui,sans-serif;fill:var(--mut)}
.fbox rect,.fbox .fshape{fill:var(--bg);stroke:var(--fg);stroke-width:1.2}
.fbox.hand rect{stroke-dasharray:5 3}
.fbox .ffold{fill:none;stroke:var(--fg);stroke-width:1.2}
.fline{fill:none;stroke:var(--fg);stroke-width:1.3;opacity:.7}
.fhead{fill:var(--fg);opacity:.7}
.flow .flink{fill:var(--acc)}
.flow a:hover .flink{text-decoration:underline}
.fdot{stroke-width:1.3}
.fdot.held{fill:var(--ok);stroke:var(--ok)}
.fdot.unheld{fill:none;stroke:var(--mut)}
.fagent text{font:700 9px ui-monospace,monospace;fill:var(--acc)}
.fagent path{stroke:var(--acc);stroke-width:1.3}
