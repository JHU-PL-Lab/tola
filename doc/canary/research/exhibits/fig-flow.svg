<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" class="flow" viewBox="0 0 1000 800" role="img" aria-label="How this page is made: from canary's code and its runs to this page"><style><![CDATA[:root{--bg:#fbfaf8;--fg:#1d1c1a;--mut:#6a665f;--line:#d9d4cb;
