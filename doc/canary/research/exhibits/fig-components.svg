<svg xmlns="http://www.w3.org/2000/svg" width="960" height="476" viewBox="0 0 960 476" class="diagram comps" role="img"><style><![CDATA[:root{--bg:#fbfaf8;--fg:#1d1c1a;--mut:#6a665f;--line:#d9d4cb;
--pm:#e8eef6;--pkg:#f3ecdf;--art:#e9f1e9;--prog:#f6e8e8;--warn:#b4451f;
--card:#fff;--acc:#2b5f8a;--ok:#2f7d3a;--bad:#c0262d;--xf:#b07a12}
:root{color:var(--fg);font:15px/1.6 ui-serif,Georgia,serif}
.diagram{width:100%;height:auto;margin:1rem 0;background:var(--card);
border:1px solid var(--line);border-radius:10px}
.sidecap{font:600 11px ui-sans-serif,system-ui,sans-serif;fill:var(--mut);
letter-spacing:.14em;text-anchor:middle}
.cname{font:700 14px ui-sans-serif,system-ui,sans-serif;fill:var(--fg)}
.csub{font-size:10px}
.cnode rect{fill:var(--card);stroke:var(--fg);stroke-width:1.3}
.cnode.cmanage rect{fill:var(--pm)}
.cnode.cart rect{fill:var(--art)}
.cnode.cjoin rect{stroke-dasharray:6 4}
.cnode.cpkg rect{fill:var(--pkg)}
.cdot{stroke:var(--fg);stroke-width:1.4;fill:none;stroke-dasharray:2 4}
.cgloss{font:11.5px ui-sans-serif,system-ui,sans-serif;fill:var(--mut)}
.clink{stroke:var(--fg);stroke-width:1.4;fill:none}
.clabel{font:11px ui-monospace,monospace;fill:var(--mut)}
svg:root{width:auto;height:auto;max-width:none;margin:0;padding:0;border:0;border-radius:0}]]></style><defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><text class="sidecap" x="160" y="34">SYSTEM SIDE</text><text class="sidecap" x="480" y="34">THE JOINS</text><text class="sidecap" x="800" y="34">LANGUAGE SIDE</text><text class="sidecap" x="14" y="103" transform="rotate(-90 14 103)">MANAGEMENT</text><text class="sidecap" x="14" y="253" transform="rotate(-90 14 253)">PACKAGES</text><text class="sidecap" x="14" y="403" transform="rotate(-90 14 403)">ARTIFACTS</text><line class="clink" x1="160" y1="146" x2="160" y2="208" marker-end="url(#ca)"/><text class="clabel" x="168" y="181">manages</text><line class="clink" x1="800" y1="146" x2="800" y2="208" marker-end="url(#ca)"/><text class="clabel" x="808" y="181">manages</text><line class="clink" x1="160" y1="296" x2="160" y2="358" marker-end="url(#ca)"/><text class="clabel" x="168" y="331">provides</text><line class="clink" x1="800" y1="296" x2="800" y2="358" marker-end="url(#ca)"/><text class="clabel" x="808" y="331">provides</text><line class="clink" x1="290" y1="253" x2="350" y2="253"/><line class="clink" x1="610" y1="253" x2="670" y2="253"/><line class="clink" x1="290" y1="403" x2="350" y2="403"/><line class="clink" x1="610" y1="403" x2="670" y2="403"/><line class="cdot" x1="290" y1="146" x2="390" y2="210"/><line class="cdot" x1="670" y1="146" x2="570" y2="210"/><line class="cdot" x1="480" y1="298" x2="480" y2="358" marker-start="url(#ca)" marker-end="url(#ca)"/><text class="clabel" x="488" y="331">relates</text><g class="cnode cmanage"><rect x="30" y="60" width="260" height="86" rx="10"/><text class="cname" x="44" y="88">M<tspan class="csub" dy="4">sys</tspan></text><text class="cgloss" x="44" y="114">the system's package manager:</text><text class="cgloss" x="44" y="130">its management part</text></g><g class="cnode cmanage"><rect x="670" y="60" width="260" height="86" rx="10"/><text class="cname" x="684" y="88">M<tspan class="csub" dy="4">lang</tspan></text><text class="cgloss" x="684" y="114">the language's package manager:</text><text class="cgloss" x="684" y="130">its management part</text></g><g class="cnode cpkg"><rect x="30" y="210" width="260" height="86" rx="10"/><text class="cname" x="44" y="238">P<tspan class="csub" dy="4">sys</tspan></text><text class="cgloss" x="44" y="264">the system's packages: metadata,</text><text class="cgloss" x="44" y="280">content, the capability file</text></g><g class="cnode cpkg cjoin"><rect x="350" y="210" width="260" height="86" rx="10"/><text class="cname" x="364" y="238">Co<tspan class="csub" dy="4">op</tspan></text><text class="cgloss" x="364" y="264">the cooperation between</text><text class="cgloss" x="364" y="280">the two package managers</text></g><g class="cnode cpkg"><rect x="670" y="210" width="260" height="86" rx="10"/><text class="cname" x="684" y="238">P<tspan class="csub" dy="4">lang</tspan></text><text class="cgloss" x="684" y="264">the language's packages: metadata,</text><text class="cgloss" x="684" y="280">content, the bridge</text></g><g class="cnode cart"><rect x="30" y="360" width="260" height="86" rx="10"/><text class="cname" x="44" y="388">A<tspan class="csub" dy="4">sys</tspan></text><text class="cgloss" x="44" y="414">system artifacts, and the tools</text><text class="cgloss" x="44" y="430">that build and inspect them</text></g><g class="cnode cart cjoin"><rect x="350" y="360" width="260" height="86" rx="10"/><text class="cname" x="364" y="388">B<tspan class="csub" dy="4">mech</tspan></text><text class="cgloss" x="364" y="414">the binding mechanism through which</text><text class="cgloss" x="364" y="430">a language and a system cooperate</text></g><g class="cnode cart"><rect x="670" y="360" width="260" height="86" rx="10"/><text class="cname" x="684" y="388">A<tspan class="csub" dy="4">lang</tspan></text><text class="cgloss" x="684" y="414">language artifacts and their tools:</text><text class="cgloss" x="684" y="430">compilers, interpreters, inspectors</text></g></svg>