<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" class="diagram comps" role="img"><style><![CDATA[:root{--bg:#fbfaf8;--fg:#1d1c1a;--mut:#6a665f;--line:#d9d4cb;
--pm:#e8eef6;--pkg:#f3ecdf;--art:#e9f1e9;--prog:#f6e8e8;--warn:#b4451f;
--card:#fff;--acc:#2b5f8a;--ok:#2f7d3a;--bad:#c0262d;--xf:#b07a12}
:root{color:var(--fg);font:15px/1.6 ui-serif,Georgia,serif}
.diagram{width:100%;height:auto;margin:1rem 0;background:var(--card);
border:1px solid var(--line);border-radius:10px}
.sidecap{font:600 11px ui-sans-serif,system-ui,sans-serif;fill:var(--mut);
letter-spacing:.14em;text-anchor:middle}
.cname{font:700 14px ui-sans-serif,system-ui,sans-serif;fill:var(--fg)}
.csub{font-size:10px}
.cnode rect{fill:var(--card);stroke:var(--fg);stroke-width:1.3}
.cnode.cmanage rect{fill:var(--pm)}
.cnode.cart rect{fill:var(--art)}
.cnode.cjoin rect{stroke-dasharray:6 4}
.cgloss{font:11.5px ui-sans-serif,system-ui,sans-serif;fill:var(--mut)}
.clink{stroke:var(--fg);stroke-width:1.4;fill:none}
.clabel{font:11px ui-monospace,monospace;fill:var(--mut)}
svg:root{width:auto;height:auto;max-width:none;margin:0;padding:0;border:0;border-radius:0}]]></style><defs><marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><text class="sidecap" x="160" y="34">SYSTEM SIDE</text><text class="sidecap" x="480" y="34">THE JOINS</text><text class="sidecap" x="800" y="34">LANGUAGE SIDE</text><text class="sidecap" x="14" y="103" transform="rotate(-90 14 103)">MANAGEMENT</text><text class="sidecap" x="14" y="273" transform="rotate(-90 14 273)">ARTIFACTS</text><line class="clink" x1="290" y1="103" x2="350" y2="103"/><line class="clink" x1="610" y1="103" x2="670" y2="103"/><line class="clink" x1="290" y1="273" x2="350" y2="273"/><line class="clink" x1="610" y1="273" x2="670" y2="273"/><line class="clink" x1="160" y1="146" x2="160" y2="228" marker-end="url(#ca)"/><text class="clabel" x="168" y="192">provides</text><line class="clink" x1="800" y1="146" x2="800" y2="228" marker-end="url(#ca)"/><text class="clabel" x="808" y="192">provides</text><g class="cnode cmanage"><rect x="30" y="60" width="260" height="86" rx="10"/><text class="cname" x="44" y="88">M<tspan class="csub" dy="4">sys</tspan></text><text class="cgloss" x="44" y="114">the system's package manager:</text><text class="cgloss" x="44" y="130">its management part</text></g><g class="cnode cmanage cjoin"><rect x="350" y="60" width="260" height="86" rx="10"/><text class="cname" x="364" y="88">Co<tspan class="csub" dy="4">op</tspan></text><text class="cgloss" x="364" y="114">the cooperation between</text><text class="cgloss" x="364" y="130">the two package managers</text></g><g class="cnode cmanage"><rect x="670" y="60" width="260" height="86" rx="10"/><text class="cname" x="684" y="88">M<tspan class="csub" dy="4">lang</tspan></text><text class="cgloss" x="684" y="114">the language's package manager:</text><text class="cgloss" x="684" y="130">its management part</text></g><g class="cnode cart"><rect x="30" y="230" width="260" height="86" rx="10"/><text class="cname" x="44" y="258">A<tspan class="csub" dy="4">sys</tspan></text><text class="cgloss" x="44" y="284">system artifacts, and the tools</text><text class="cgloss" x="44" y="300">that build and inspect them</text></g><g class="cnode cart cjoin"><rect x="350" y="230" width="260" height="86" rx="10"/><text class="cname" x="364" y="258">B<tspan class="csub" dy="4">mech</tspan></text><text class="cgloss" x="364" y="284">the binding mechanism through which</text><text class="cgloss" x="364" y="300">a language and a system cooperate</text></g><g class="cnode cart"><rect x="670" y="230" width="260" height="86" rx="10"/><text class="cname" x="684" y="258">A<tspan class="csub" dy="4">lang</tspan></text><text class="cgloss" x="684" y="284">language artifacts and their tools:</text><text class="cgloss" x="684" y="300">compilers, interpreters, inspectors</text></g></svg>